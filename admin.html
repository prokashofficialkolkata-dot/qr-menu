<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hameed Bistro Admin V2</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>



<!-- =========================
ADMIN LOGIN
========================= -->


<div id="loginBox" class="login-box">


<h1>
Restoran Hameed's Bistro
</h1>


<h2>
Admin Login
</h2>



<input 
id="adminEmail"
type="email"
placeholder="Email">



<input
id="adminPassword"
type="password"
placeholder="Password">



<button onclick="adminLogin()">

Login

</button>



<p id="loginMessage"></p>


</div>







<!-- =========================
ADMIN DASHBOARD
========================= -->


<div id="dashboard" style="display:none;">



<header>


<h1>
Hameed Bistro Admin
</h1>



<button onclick="adminLogout()">

Logout

</button>


</header>





<nav>


<button onclick="showAdminPage('orders')">

📦 Orders

</button>



<button onclick="showAdminPage('menuManager')">

📋 Menu

</button>



<button onclick="showAdminPage('sales')">

📊 Sales

</button>



<button onclick="showAdminPage('history')">

🕘 History

</button>


</nav>









<!-- =========================
ORDERS PAGE
========================= -->


<section id="orders" class="adminPage">


<h2>
New Orders
</h2>


<div id="ordersList">

Loading Orders...

</div>


</section>









<!-- =========================
MENU MANAGEMENT
========================= -->


<section 
id="menuManager"
class="adminPage"
style="display:none;">



<h2>
Menu Management
</h2>





<!-- CSV UPLOAD -->


<h3>
Bulk Update Menu CSV
</h3>



<input
type="file"
id="csvFile"
accept=".csv">



<button onclick="uploadMenuCSV()">

Upload CSV

</button>



<p id="uploadStatus"></p>







<hr>





<!-- ADD ITEM -->


<h3>
Add New Menu Item
</h3>



<input
id="menuName"
placeholder="Item Name">



<input
id="menuCategory"
placeholder="Category">



<input
id="menuPrice"
type="number"
placeholder="Price">



<input
id="menuImage"
placeholder="Image URL">



<select id="menuPopular">


<option value="no">
Not Popular
</option>


<option value="yes">
Popular
</option>


</select>



<button onclick="addMenuItem()">

Save Item

</button>



<p id="menuMessage"></p>







<hr>





<!-- MENU LIST -->


<h3>
Current Menu

</h3>



<div id="menuList">

Loading Menu...

</div>




</section>









<!-- =========================
SALES REPORT
========================= -->


<section 
id="sales"
class="adminPage"
style="display:none;">


<h2>
Sales Report
</h2>



<div id="salesReport">

</div>


</section>









<!-- =========================
HISTORY
========================= -->


<section 
id="history"
class="adminPage"
style="display:none;">


<h2>
Order History

</h2>



<div id="historyList">

</div>



</section>







</div>









<script>


function showAdminPage(page){


document
.querySelectorAll(".adminPage")
.forEach(function(section){


section.style.display="none";


});



const target =
document.getElementById(page);



if(target){

target.style.display="block";

}


}



</script>




<script type="module" src="admin.js"></script>



</body>


</html>
