<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Hameed Bistro Admin
</title>


<link rel="stylesheet" href="admin.css">


</head>


<body>





<!-- LOGIN -->

<div id="loginBox" class="loginBox">


<h1>
Restoran Hameed's Bistro
</h1>


<h2>
Admin Login
</h2>



<input

id="adminEmail"

type="email"

placeholder="Admin Email"

>



<input

id="adminPassword"

type="password"

placeholder="Password"

>



<button onclick="adminLogin()">

Login

</button>



<p id="loginMessage"></p>


</div>









<!-- DASHBOARD -->


<div id="dashboard" style="display:none;">





<header>


<h1>
Hameed Bistro Admin Panel
</h1>



<button onclick="adminLogout()">

Logout

</button>


</header>









<!-- CSV UPLOAD -->


<section>


<h2>
Upload Menu CSV
</h2>



<p>

Format:

<br>

Category, Item Name, Dine in price, Take away Price

</p>





<input

type="file"

id="csvFile"

accept=".csv"

>



<button onclick="uploadCSV()">

Upload CSV

</button>




<p id="uploadStatus"></p>



</section>









<!-- ADD MENU -->


<section>


<h2>
Add Menu Item
</h2>




<input

id="itemCategory"

placeholder="Category"

>



<input

id="itemName"

placeholder="Item Name"

>



<input

id="itemDinePrice"

placeholder="Dine In Price"

type="number"

>



<input

id="itemTakePrice"

placeholder="Take Away Price"

type="number"

>




<button onclick="addMenuItem()">

Add Item

</button>



</section>









<!-- MENU LIST -->


<section>


<h2>
Menu List
</h2>



<div id="menuList">

Loading...

</div>



</section>









<script type="module" src="js/admin.js"></script>



</body>

</html>
