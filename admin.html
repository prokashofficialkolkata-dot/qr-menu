<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Hameed Bistro Admin
</title>


<link rel="stylesheet" href="admin.css">


</head>


<body>


<div id="loginBox">


<h1>
Hameed Bistro
</h1>


<h2>
Admin Login
</h2>


<input id="adminEmail"
type="email"
placeholder="Email">


<input id="adminPassword"
type="password"
placeholder="Password">


<button onclick="adminLogin()">

Login

</button>



<p id="loginMessage"></p>


</div>









<div id="dashboard" style="display:none;">



<header>


<h1>
Hameed Bistro Admin Panel
</h1>


<button onclick="adminLogout()">

Logout

</button>


</header>









<section>


<h2>
Menu Upload CSV
</h2>


<input 
type="file"
id="csvFile"
accept=".csv">



<button onclick="uploadCSV()">

Upload Menu

</button>



<p id="uploadStatus"></p>


</section>









<section>


<h2>
Add Menu Item
</h2>



<input id="itemName"
placeholder="Item Name">



<input id="itemCategory"
placeholder="Category">



<input id="itemPrice"
placeholder="Price">



<input id="itemImage"
placeholder="Image URL">



<button onclick="addMenuItem()">

Add Item

</button>



</section>








<section>


<h2>
Menu List
</h2>



<div id="menuList">

Loading...

</div>



</section>








<script type="module" src="js/admin.js"></script>


</body>


</html>
