<!DOCTYPE html>
<html>
<head>

</head>

<body>

<div style="text-align:center;">

    <img src="images/logo.png" width="180">

    <h1>Welcome To<br>Restoran Hameeds Bistro</h1>

    <div class="languages">
    <button>🇬🇧 English</button>
    <button>🇲🇾 Malay</button>
    <button>🇮🇳 தமிழ்</button>

    <br><br>
    
<div class="price-switch">

  <button onclick="setPriceMode('takeaway')">Take Away</button>
</div>

<div id="menu-container"></div>

<script src="script.js"></script>

</html>
