<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Restoran Hameed's Bistro
</title>


<link rel="icon" href="images/logo.png">


<link rel="stylesheet" href="style.css">


</head>


<body>



<!-- ========================= -->
<!-- WELCOME PAGE -->
<!-- ========================= -->


<div id="welcome">



<div class="top-bar">


<button onclick="refreshPage()">

🔄 Refresh

</button>



<button onclick="showCart()">

🛒 Cart

(<span id="cartCount">0</span>)

</button>


</div>






<div class="logo-circle">

<img src="images/logo.png" class="logo">

</div>





<h1>

Restoran Hameed's Bistro

</h1>



<h2>

QR Menu & Ordering System

</h2>







<!-- LANGUAGE -->

<div class="languages">


<button onclick="setLanguage('en')">
English
</button>


<button onclick="setLanguage('ms')">
Malay
</button>


<button onclick="setLanguage('ta')">
Tamil
</button>


<button onclick="setLanguage('zh')">
Chinese
</button>


<button onclick="setLanguage('hi')">
Hindi
</button>


<button onclick="setLanguage('bn')">
Bangla
</button>


</div>







<!-- ORDER TYPE -->


<div class="order-type">


<button onclick="startMenu('DINE IN')">

🍽 DINE IN

</button>



<button onclick="startMenu('TAKE AWAY')">

🥡 TAKE AWAY

</button>



</div>








<!-- CUSTOMER LOGIN -->


<div class="welcome-login">


<button
class="login-btn"
onclick="checkout()">

👤 Customer Login

</button>


</div>





</div>









<!-- ========================= -->
<!-- MENU PAGE -->
<!-- ========================= -->


<div id="menuPage" style="display:none;">





<div class="top-bar">



<button onclick="goBack()">

⬅ Back

</button>



<button onclick="goHome()">

🏠 Home

</button>




<button onclick="showPopular()">

⭐ Popular

</button>




<button onclick="refreshPage()">

🔄 Refresh

</button>




<button onclick="showCart()">

🛒 Cart

(<span id="cartCount2">0</span>)

</button>




</div>







<button class="main-btn"
onclick="openCategory()">

📋 SELECT CATEGORY

</button>







<div id="categoryBox">

</div>









<!-- POPULAR -->

<div id="popularSection">


<h2>

⭐ Popular Items

</h2>


<div id="popularItems">


</div>


</div>







<!-- ITEMS -->

<div id="itemBox">


</div>






</div>









<!-- ========================= -->
<!-- CART PAGE -->
<!-- ========================= -->


<div id="cartPage" style="display:none;">



<div class="top-bar">


<button onclick="goBack()">

⬅ Back

</button>


<button onclick="goHome()">

🏠 Home

</button>



<button onclick="refreshPage()">

🔄 Refresh

</button>



</div>






<h2>

🛒 Your Cart

</h2>





<div id="cartItems">

</div>





<h3 id="total">

Total : RM 0.00

</h3>







<button class="main-btn"
onclick="checkout()">

CHECKOUT

</button>



</div>









<!-- ========================= -->
<!-- CHECKOUT PAGE -->
<!-- ========================= -->


<div id="checkoutPage" style="display:none;">





<div id="loginBox">


<h2>

Customer Login

</h2>




<input id="loginEmail"
type="email"
placeholder="Email Address">





<input id="loginPassword"
type="password"
placeholder="Password">






<button onclick="loginUser()">

LOGIN

</button>





<button onclick="googleLogin()">

Sign in with Google

</button>




<p onclick="showCreateAccount()">

Create Account

</p>



</div>









<!-- CREATE ACCOUNT -->


<div id="createBox" style="display:none;">


<h2>

Create Account

</h2>



<input id="createName"
placeholder="Customer Name">



<input id="createPhone"
placeholder="Phone Number">



<input id="createEmail"
placeholder="Email">



<input id="createPassword"
type="password"
placeholder="Password">



<input id="confirmPassword"
type="password"
placeholder="Confirm Password">





<button onclick="createAccount()">

CREATE ACCOUNT

</button>



</div>








<!-- GOOGLE PROFILE -->


<div id="phoneBox" style="display:none;">


<h2>

Complete Profile

</h2>


<input id="googlePhone"
placeholder="Phone Number">



<button onclick="saveGooglePhone()">

SAVE

</button>



</div>









<!-- CHECKOUT FORM -->


<div id="checkoutForm" style="display:none;">


<h2>

Checkout

</h2>




<input id="customerName"
readonly>



<input id="phone"
readonly>




<button onclick="placeOrder()">

PLACE ORDER

</button>




</div>




</div>

<!-- FOOTER -->
<!-- ========================= -->


<footer>

</footer>

<script type="module" src="js/auth.js"></script>



<script src="js/main.js"></script>


<script src="js/menu.js"></script>


<script src="js/cart.js"></script>



<script type="module" src="js/checkout.js"></script>





</body>

</html>
