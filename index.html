<head>

<!-- HEADER -->

<header class="header">


<h1>
Restoran Hameed's Bistro
</h1>


<p>
Digital QR Menu
</p>


</header>








<!-- DINE / TAKE AWAY -->

<div class="price-switch">


<button onclick="changeMenuType('dine')">

🍽 Dine In

</button>



<button onclick="changeMenuType('take')">

🥡 Take Away

</button>



</div>









<!-- POPULAR ITEMS -->


<section class="section">


<h2>
🔥 Top 15 Popular Items
</h2>



<div id="popularItems" class="menu-grid">


Loading Popular Items...


</div>



</section>









<!-- CATEGORY -->


<section class="section">


<h2>
Select Category
</h2>



<div id="categoryList" class="category-grid">


Loading Categories...


</div>



</section>









<!-- MENU LIST -->


<section class="section">


<h2 id="categoryTitle">

Menu Items

</h2>



<div id="menuItems" class="menu-grid">


Please Select Category


</div>



</section>









<!-- FOOTER -->


<footer>


<p>
Thank You For Visiting
</p>


<p>
Restoran Hameed's Bistro
</p>


</footer>
