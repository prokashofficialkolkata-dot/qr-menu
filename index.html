<!DOCTYPE html>
<html>
<head>
<link rel="icon" href="images/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restoran Hameed's Bistro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Welcome Page -->

<div id="welcome">

<div class="top-bar">

<button id="refreshBtn" onclick="refreshPage()">
🔄 Refresh
</button>

<button id="cartBtnTop" onclick="showCart()">
🛒 Show Cart (<span id="cartCount">0</span>)
</button>

</div>

<img src="images/logo.png" class="logo">


<h1>Restoran Hameed's Bistro</h1>

<h2>Ordering System & Digital Menu</h2>


<div class="languages">

<button onclick="setLanguage('en')">🇬🇧<br>English</button>

<button onclick="setLanguage('ms')">🇲🇾<br>Malay</button>

<button onclick="setLanguage('ta')">🇮🇳<br>Tamil</button>

<button onclick="setLanguage('zh')">🇨🇳<br>Chinese</button>

<button onclick="setLanguage('hi')">🇮🇳<br>Hindi</button>

<button onclick="setLanguage('bn')">🇧🇩<br>Bangla</button>

</div>


<div class="order-type">

<button onclick="startMenu('DINE IN')">
DINE IN
</button>


<button onclick="startMenu('TAKE AWAY')">
TAKE AWAY
</button>

</div>


</div>





<!-- Menu Page -->

<div id="menuPage" style="display:none;">

<div class="top-bar">

<button id="backBtn" onclick="goBack()">
⬅ Back
</button>

<button id="homeBtn" onclick="goHome()">
🏠 Home
</button>

<button onclick="refreshPage()">
🔄 Refresh
</button>

<button onclick="showCart()">
🛒 Show Cart (<span id="cartCount2">0</span>)
</button>

</div>

<button onclick="openCategory()" class="main-btn">
SELECT CATEGORY
</button>


<div id="categoryBox"></div>


<div id="itemBox"></div>



<button onclick="showCart()" id="cartBtn">
🛒 SHOW CART
</button>


</div>





<!-- Cart Page -->

<div id="cartPage" style="display:none;">


<h2>
YOUR CART
</h2>


<div id="cartItems"></div>


<h3 id="total"></h3>


<button onclick="checkout()" class="main-btn">
CHECKOUT
</button>


<button onclick="goBack()" class="back-btn">
⬅ BACK
</button>

<button onclick="goHome()" class="main-btn">
🏠 HOME
</button>

<button onclick="refreshPage()" class="main-btn">
🔄 REFRESH
</button>


</div>





<!-- Checkout Page -->

<div id="checkoutPage" style="display:none;">


<h2>
CHECKOUT
</h2>


<div id="tableInput"></div>


<input id="customerName" placeholder="Customer Name">


<input id="phone" placeholder="Phone Number">



<button onclick="placeOrder()" class="main-btn">
PLACE ORDER
</button>
<button onclick="goBack()" class="back-btn">
⬅ BACK
</button>

<button onclick="goHome()" class="main-btn">
🏠 HOME
</button>

<button onclick="refreshPage()" class="main-btn">
🔄 REFRESH
</button>

</div>





<script type="module" src="script.js"></script>


</body>

</html>
