<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restoran Hameed's Bistro</title>

<link rel="icon" href="images/logo.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<div class="top-bar">

<button onclick="refreshPage()">
🔄 Refresh
</button>


<button onclick="showCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>


<span id="logoutArea"></span>

</div>





<!-- ========================= -->
<!-- HOME PAGE -->
<!-- ========================= -->

<div id="welcome">


<div class="logo-box">

<img src="images/logo.png" class="logo">

</div>



<h1>
Restoran Hameed's Bistro
</h1>


<h2>
QR Ordering, QR Menu & Ordering System
</h2>





<!-- LANGUAGE -->

<div class="languages">


<button onclick="setLanguage('en')">
🇬🇧 English
</button>


<button onclick="setLanguage('ms')">
🇲🇾 Malay
</button>


<button onclick="setLanguage('ta')">
🇮🇳 Tamil
</button>


<button onclick="setLanguage('zh')">
🇨🇳 Chinese
</button>


<button onclick="setLanguage('hi')">
🇮🇳 Hindi
</button>


<button onclick="setLanguage('bn')">
🇧🇩 বাংলা
</button>


</div>






<!-- ORDER TYPE -->


<div class="order-type">


<button onclick="startMenu('DINE IN')">

🍽 DINE IN

</button>



<button onclick="startMenu('TAKE AWAY')">

🥡 TAKE AWAY

</button>



</div>







<!-- LOGIN -->

<div class="welcome-login">


<button class="main-btn" onclick="openLogin()">

👤 Customer Login

</button>


</div>



</div>







<!-- ========================= -->
<!-- MENU PAGE -->
<!-- ========================= -->

<div id="menuPage" style="display:none;">



<div class="navigation">


<button onclick="goBack()">
⬅ Back
</button>


<button onclick="goHome()">
🏠 Home
</button>


<button onclick="refreshPage()">
🔄 Refresh
</button>


<button onclick="showCart()">
🛒 Cart (<span id="cartCount2">0</span>)
</button>


</div>





<div class="languages small">


<button onclick="setLanguage('en')">EN</button>

<button onclick="setLanguage('ms')">BM</button>

<button onclick="setLanguage('ta')">TA</button>

<button onclick="setLanguage('zh')">中文</button>

<button onclick="setLanguage('hi')">HI</button>

<button onclick="setLanguage('bn')">BN</button>


</div>





<button class="main-btn" onclick="openCategory()">

📋 SELECT CATEGORY

</button>



<div id="categoryBox"></div>



<div id="popularSection">


<h2>
⭐ Popular Items
</h2>


<div id="popularItems"></div>


</div>



<div id="itemBox"></div>



</div>







<!-- ========================= -->
<!-- CART PAGE -->
<!-- ========================= -->


<div id="cartPage" style="display:none;">


<h2>
🛒 Your Cart
</h2>


<div id="cartItems">

</div>


<h3 id="total">

Total : RM 0.00

</h3>



<button onclick="checkout()">
✅ CHECKOUT
</button>


</div>







<!-- ========================= -->
<!-- CHECKOUT + LOGIN -->
<!-- ========================= -->


<div id="checkoutPage" style="display:none;">





<div id="loginBox" style="display:none;">


<h2>
Customer Login
</h2>


<input id="loginEmail"
type="email"
placeholder="Email Address">


<input id="loginPassword"
type="password"
placeholder="Password">



<button onclick="loginUser()">

LOGIN

</button>



<button onclick="googleLogin()">

Sign in with Google

</button>



<p onclick="showCreateAccount()">

Create Account

</p>



</div>








<div id="createBox" style="display:none;">


<h2>
Create Account
</h2>



<input id="createName"
placeholder="Customer Name">


<input id="createPhone"
placeholder="Phone Number">


<input id="createEmail"
type="email"
placeholder="Email Address">



<input id="createPassword"
type="password"
placeholder="Password">



<input id="confirmPassword"
type="password"
placeholder="Confirm Password">



<button onclick="createAccount()">

CREATE ACCOUNT

</button>



<p onclick="showLogin()">

Back To Login

</p>


</div>








<div id="phoneBox" style="display:none;">


<h2>
Complete Profile
</h2>


<input id="googlePhone"
placeholder="Phone Number">



<button onclick="saveGooglePhone()">

SAVE

</button>


</div>








<div id="checkoutForm" style="display:none;">


<h2>
Checkout
</h2>



<input id="customerName"
readonly>


<input id="phone"
readonly>




<button onclick="placeOrder()">

PLACE ORDER

</button>


</div>




</div>








<!-- FOOTER -->


<footer>

© 2023 Prokash Rakkhit. All Rights Reserved. | Version 1.0.0

</footer>







<script type="module" src="js/firebase.js"></script>

<script type="module" src="js/auth.js"></script>

<script src="js/main.js"></script>

<script src="js/menu.js"></script>

<script src="js/cart.js"></script>

<script src="js/checkout.js"></script>


</body>

</html>
