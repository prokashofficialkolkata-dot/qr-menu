<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restoran Hameed's Bistro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="welcome">


<img src="images/logo.png" class="logo">


<h1>
Restoran Hameed's Bistro
</h1>


<h2>
Ordering System & Digital Menu
</h2>



<div class="languages">

<button onclick="setLanguage('en')">
🇬🇧<br>English
</button>


<button onclick="setLanguage('ms')">
🇲🇾<br>Malay
</button>


<button onclick="setLanguage('ta')">
🇮🇳<br>Tamil
</button>


<button onclick="setLanguage('zh')">
🇨🇳<br>Chinese
</button>


<button onclick="setLanguage('hi')">
🇮🇳<br>Hindi
</button>


<button onclick="setLanguage('bn')">
🇧🇩<br>Bangla
</button>


</div>



<div class="type">

<button onclick="openMenu('Dine In')">
DINE IN
</button>


<button onclick="openMenu('Take Away')">
TAKE AWAY
</button>

</div>



</div>



<div id="menuPage" style="display:none">
<button class="back-btn" onclick="goBack()">
⬅ BACK
</button>
<h2 id="menuTitle">
Menu
</h2>


<button onclick="showCategories()">
SELECT CATEGORY
</button>


<div id="categories"></div>


<div id="items"></div>


</div>



<script src="script.js"></script>


</body>

</html>
