<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Restoran Hameed's Bistro

</title>

<link rel="icon" href="images/logo.png">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================= -->

<!-- WELCOME PAGE -->

<!-- ========================= -->

<div id="welcome">

<div class="top-bar">

<button onclick="refreshPage()">

🔄 Refresh

</button>

<button onclick="showCart()">

🛒 Cart

(<span id="cartCount">0</span>)

</button>

</div>

<img

src="images/logo.png"

class="logo"

>

<h1>

Restoran Hameed's Bistro

</h1>

<h2>

QR Ordering System

</h2>

<!-- Language -->

<div class="languages">

<button onclick="setLanguage('en')">

🇬🇧

English

</button>

<button onclick="setLanguage('ms')">

🇲🇾

Malay

</button>

<button onclick="setLanguage('ta')">

🇮🇳

Tamil

</button>

<button onclick="setLanguage('zh')">

🇨🇳

Chinese

</button>

<button onclick="setLanguage('hi')">

🇮🇳

Hindi

</button>

<button onclick="setLanguage('bn')">

🇧🇩

Bangla

</button>

</div>

<!-- Order Type -->

<div class="order-type">

<button onclick="startMenu('DINE IN')">

🍽️ DINE IN

</button>

<button onclick="startMenu('TAKE AWAY')">

🥡 TAKE AWAY

</button>

</div>

<!-- Customer Login -->

<div class="welcome-login">

<button

class="main-btn"

onclick="checkout()">

👤 Customer Login

</button>

</div>

</div>
<!-- ========================= -->
<!-- MENU PAGE -->
<!-- ========================= -->

<div id="menuPage" style="display:none;">

<div class="top-bar">

<button onclick="goBack()">
⬅ Back
</button>

<button onclick="goHome()">
🏠 Home
</button>

<button onclick="refreshPage()">
🔄 Refresh
</button>

<button onclick="showCart()">
🛒 Cart
(<span id="cartCount2">0</span>)
</button>

</div>

<button
class="main-btn"
onclick="openCategory()">

📋 SELECT CATEGORY

</button>

<div id="categoryBox"></div>

<!-- Popular Items -->

<div id="popularSection">

<h2>

⭐ Popular Items

</h2>

<div id="popularItems">

</div>

</div>

<!-- Menu Items -->

<div id="itemBox">

</div>

</div>





<!-- ========================= -->
<!-- CART PAGE -->
<!-- ========================= -->

<div id="cartPage" style="display:none;">

<h2>

🛒 Your Cart

</h2>

<div id="cartItems">

</div>

<h3 id="total">

Total : RM 0.00

</h3>

<div class="cart-buttons">

<button
class="main-btn"
onclick="checkout()">

✅ CHECKOUT

</button>

<button
class="back-btn"
onclick="goBack()">

⬅ BACK

</button>

<button
class="main-btn"
onclick="goHome()">

🏠 HOME

</button>

<button
class="main-btn"
onclick="refreshPage()">

🔄 REFRESH

</button>

</div>

</div>
<!-- ========================= -->
<!-- CHECKOUT PAGE -->
<!-- ========================= -->

<div id="checkoutPage" style="display:none;">

<!-- ========================= -->
<!-- LOGIN BOX -->
<!-- ========================= -->

<div id="loginBox">
<div id="loginBox" style="display:none;">

<h2>Customer Login</h2>

<input
id="loginEmail"
type="email"
placeholder="Email Address">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button
class="main-btn"
onclick="loginUser()">

LOGIN

</button>

<button
class="google-btn"
onclick="googleLogin()">

Sign in with Google

</button>

<p class="link"

onclick="showCreateAccount()">

Create Account

</p>

</div>



<!-- ========================= -->
<!-- CREATE ACCOUNT -->
<!-- ========================= -->

<div id="createBox" style="display:none;">

<h2>Create Account</h2>

<input
id="createName"
placeholder="Customer Name">

<input
id="createPhone"
placeholder="Phone Number">

<input
id="createEmail"
type="email"
placeholder="Email Address">

<input
id="createPassword"
type="password"
placeholder="Password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password">

<button
class="main-btn"
onclick="createAccount()">

CREATE ACCOUNT

</button>

<p class="link"

onclick="showLogin()">

Back To Login

</p>

</div>



<!-- ========================= -->
<!-- COMPLETE PROFILE -->
<!-- ========================= -->

<div id="phoneBox" style="display:none;">

<h2>

Complete Profile

</h2>

<p>

Please enter your phone number.

</p>

<input
id="googlePhone"
placeholder="Phone Number">

<button
class="main-btn"
onclick="saveGooglePhone()">

SAVE

</button>

</div>



<!-- ========================= -->
<!-- CHECKOUT FORM -->
<!-- ========================= -->

<div
id="checkoutForm"
style="display:none;">

<h2>

Checkout

</h2>

<div id="tableInput">

</div>

<input
id="customerName"
placeholder="Customer Name"
readonly>

<input
id="phone"
placeholder="Phone Number"
readonly>

<button
class="main-btn"
onclick="placeOrder()">

PLACE ORDER

</button>

<button
class="back-btn"
onclick="goBack()">

⬅ BACK

</button>

<button
class="main-btn"
onclick="goHome()">

🏠 HOME

</button>

<button
class="main-btn"
onclick="refreshPage()">

🔄 REFRESH

</button>

</div>

</div>
<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script type="module" src="script.js"></script>

</body>

</html>
